[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyeyesweb"
version = "2.0.0a1"
requires-python = ">=3.10"
authors = [
    {name = "InfoMus Lab - Casa Paganini", email = "cp.infomus@gmail.com"}
]
maintainers = [
    {name = "Nicola Corbellini", email = "nicola.corbellini@edu.unige.it"},
    {name = "Gabriele Romano", email = "gabriele.romano@edu.unige.it"},
    {name = "Sanket Rajeev Sabharwal", email = "sabharwal@edu.unige.it"},
    {name = "Simone Ghisio", email = "simoneghisio@gmail.com"},
    {name = "Paolo Coletta", email = "paolocoletta@gmail.com"}
]
description = "A research toolkit for extracting quantitative features from human movement data: expressive qualities of movement, on live streams and recordings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = [
    "movement analysis",
    "human movement",
    "motor control",
    "biomechanics",
    "kinematics",
    "time series",
    "synchronization",
    "computational movement",
    "quantitative movement"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# Runtime: NumPy and the compiled core (the separate binary wheel `eyesweb-core`, import name `eyesweb_core`). The lower bound
# names the alpha because 2.0.0a1 sorts before 2.0; `<2.1` mirrors REQUIRED_CORE = (2, 0) in pyeyesweb/_core.py.
dependencies = [
    "numpy>=1.24.0",
    "eyesweb-core>=2.0.0a1,<2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "tomli>=2.0; python_version < '3.11'",  # tests/unit_tests/test_packaging.py reads pyproject.toml
]
pandas = [
    "pandas>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "tomli>=2.0; python_version < '3.11'",
    "pytest-cov>=4.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pooch>=1.8",
    "build>=1.0.0",
    "twine>=5.0.0",
]
datasets = [
    "pooch>=1.8",
]
docs = [
    "sphinx>=8.0",
    "pydata-sphinx-theme>=0.16",
    "myst-parser>=4.0",
    "numpydoc>=1.8",
    "sphinx-gallery>=0.19",
    "sphinxcontrib-bibtex>=2.6",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "scipy>=1.10",
    "pillow>=10.0",
    "pooch>=1.8",
    "pyyaml>=6.0",
]

[project.urls]
Documentation = "https://infomuscp.github.io/PyEyesWeb/"
Source = "https://github.com/InfoMusCP/PyEyesWeb"
Issues = "https://github.com/InfoMusCP/PyEyesWeb/issues"
Changelog = "https://github.com/InfoMusCP/PyEyesWeb/blob/main/CHANGELOG.md"
"Casa Paganini" = "http://www.casapaganini.org/index_eng.php"
"Resilence EU Project" = "https://resilence.eu/"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyeyesweb*"]
exclude = ["tests*", "docs*", "examples*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "."
]