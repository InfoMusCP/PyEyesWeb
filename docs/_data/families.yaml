# Feature families: every catalog feature belongs to exactly one family (the extension fails the build otherwise).
# Held back from the early release (2026-11-13), with their pages in docs/_held_back: MassSpringSimulator (humanoid_models),
# Suddenness, SuddennessImpulsivity, ContractionImpulsivity (impulsivity_suddenness), MotionNoiseDetector, Harmonicity,
# PositionDependingPotentials, RegionDependingPotentials, NonlinearInterdependence, SpikeSynchronization.
# A family names a theory page (doc: path relative to docs/, without suffix). Decided 2026-10-15: HitCellDetector,
# PositionDependingPotentials and RegionDependingPotentials stay in shape_symmetry_balance.
kinematics_energy:
  title: Kinematics and energy
  doc: theory/kinematics_energy
  features: [Kinematics, KineticEnergy, DirectionChange, Directness, TrajectoryNonPlanarity]
smoothness:
  title: Smoothness
  doc: theory/smoothness
  features: [SpectralArcLength, LogDimensionlessJerk, SubmovementCount, CurvatureVelocityCorrelation]
shape_symmetry_balance:
  title: Shape, symmetry and balance
  doc: theory/shape_symmetry_balance
  features: [BoundingBoxFilledArea, EllipsoidSphericity, PointsDensity, Symmetry, TriangleSymmetry, Equilibrium,
             HitCellDetector]
gesture_segmentation:
  title: Gesture segmentation
  doc: theory/gesture_segmentation
  features: [GestureSegmenter, MotionDuration, ScalarPeakDetector]
entropy_rarity_periodicity:
  title: Entropy, rarity and periodicity
  doc: theory/entropy_rarity_periodicity
  features: [SampleEntropy, MultiScaleEntropy, Rarity, Periodicity, BinaryPulsesRegularity]
synchronization:
  title: Synchronization
  doc: theory/synchronization
  features: [PhaseLockingValue, PartialRecurrenceSynchronization, GeneralisedAutoCorrelation,
             EventSynchronization, EventSynchronizationMECS,
             RecurrencePlot, CrossRecurrencePlot]
dominance:
  title: Dominance
  doc: theory/dominance
  features: [EnsembleDominance]
imaging:
  title: Imaging
  doc: theory/imaging
  features: [SilhouetteCentroids, SilhouetteBodyParts, Videogram, ContourCurvature, BodyPartsFromCurvature]
