name: Publish

# PyEyesWeb 2.x is a pure-Python wheel (plus an sdist) that depends on the binary wheel `eyesweb-core`, published separately
# from the private core repository: publish the core first, or `pip install pyeyesweb` cannot resolve.
#
# - A pushed tag `v*` (for example v2.0.0a1, made on dev): builds, checks and uploads to TestPyPI. A tag runs the workflow file of
#   the tagged commit, so this works from dev without the file being on the default branch.
# - Manual run (workflow_dispatch): the same; GitHub lists a manual workflow only when its file is on the default branch.
# - A published GitHub release: builds, checks and uploads to PyPI (a tag such as v2.0.0a1 is a pre-release: tick "pre-release").
#
# Trusted publishing (OIDC): no token is stored. One-time setup by the maintainer, on pypi.org and test.pypi.org: project
# `pyeyesweb` > Publishing > add a GitHub publisher (owner InfoMusCP, repository PyEyesWeb, workflow `pypi_deploy.yml`,
# environment `testpypi` respectively `pypi`); then create the two environments in the repository settings (give `pypi` a
# required reviewer).

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check the metadata
        run: python -m twine check --strict dist/*
      - name: The version of the package matches the release tag
        if: github.ref_type == 'tag'
        run: |
          python -c "import glob, os; tag = os.environ['GITHUB_REF_NAME'].lstrip('v'); version = os.path.basename(glob.glob('dist/*.whl')[0]).split('-')[1]; assert version == tag, f'tag {tag} but the wheel is {version}'"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyeyesweb
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/pyeyesweb
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
