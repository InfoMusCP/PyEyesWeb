name: Tests

# Until the eyesweb-core wheel exists on PyPI (packaging, work package E of ALPHA_REVIEW.md) the core cannot be installed in CI:
# tests/conftest.py then collects only the pure-Python subset (no core) and skips the rest. After the first eyesweb-core
# release `pip install .` brings the core and the whole suite runs.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package and the test tools
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pytest-cov
      - name: Run the tests
        run: python -m pytest -ra
