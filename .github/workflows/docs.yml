name: Docs

# `pip install .[docs]` pulls the binary wheel `eyesweb-core` from PyPI. Until it is published there, set the repository
# variable CORE_FROM_TESTPYPI to `true` (or tick the input of a manual run): the core is then installed from TestPyPI first,
# alone and with --no-deps. The gallery reads the sensor data of examples/data, which is part of the checkout.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core_from_testpypi:
        description: "Install eyesweb-core from TestPyPI (until it is published on PyPI)"
        type: boolean
        default: true

env:
  CORE_FROM_TESTPYPI: ${{ github.event_name == 'workflow_dispatch' && inputs.core_from_testpypi || vars.CORE_FROM_TESTPYPI }}

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt
      - name: Install the core from TestPyPI (only while it is not on PyPI)
        if: env.CORE_FROM_TESTPYPI == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre --no-deps --index-url https://test.pypi.org/simple/ "eyesweb-core>=2.0.0a1,<2.1"
      - name: Install the pinned documentation toolchain, then the package
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install ".[docs]" pytest
      - name: Spelling (project words in docs/spelling_wordlist.txt)
        run: |
          python -m pip install codespell
          codespell -I docs/spelling_wordlist.txt docs/*.md docs/getting_started docs/concepts docs/theory docs/user_guide \
            docs/howto docs/developer docs/api/*.md README.md pyeyesweb examples/*/plot_*.py examples/helpers.py
      - name: Build the documentation (warnings are errors; the gate of docs/_ext/docs_gate.py runs here)
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Tutorials within their run-time budget (60 s per script, 10 min in total)
        run: python tools/check_gallery_times.py docs/_build/html/sphinx-gallery/junit-results.xml
      - name: Executed examples of the prose pages (doctest builder)
        run: python -m sphinx -b doctest docs docs/_build/doctest
      - name: Examples of the docstrings
        run: python -m pytest --doctest-modules pyeyesweb
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/_build/html

  deploy:
    # Only pushes to main deploy; pull-request builds stop after `build`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
