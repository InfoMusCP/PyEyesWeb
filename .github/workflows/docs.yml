name: Docs

# NOTE: this job works only after the first eyesweb-core release (packaging, work package E of ALPHA_REVIEW.md):
# `pip install .[docs]` pulls the binary wheel `eyesweb-core` from PyPI (or TestPyPI for an alpha). Until then build locally,
# see the command at the top of docs/conf.py. Pin the eyesweb-core version in pyproject.toml when it exists.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the package and the documentation toolchain
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"
      - name: Spelling (project words in docs/spelling_wordlist.txt)
        run: |
          pip install codespell
          codespell -I docs/spelling_wordlist.txt docs/*.md docs/getting_started docs/concepts docs/theory docs/user_guide \
            docs/howto docs/developer docs/api/*.md README.md pyeyesweb examples/*/plot_*.py examples/helpers.py
      - name: Build the documentation (warnings are errors; the gate of docs/_ext/docs_gate.py runs here)
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Tutorials within their run-time budget (60 s per script, 10 min in total)
        run: python tools/check_gallery_times.py docs/_build/html/sphinx-gallery/junit-results.xml
      - name: Executed examples of the prose pages (doctest builder)
        run: python -m sphinx -b doctest docs docs/_build/doctest
      - name: Examples of the docstrings
        run: |
          pip install pytest
          python -m pytest --doctest-modules pyeyesweb
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/_build/html

  deploy:
    # Only pushes to main deploy; pull-request builds stop after `build`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
