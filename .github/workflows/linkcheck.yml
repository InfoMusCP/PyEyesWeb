name: Links

# Weekly check of the external links of the documentation (DOCS_PLAN.md 11.2). Not a pull-request gate: a site that is down
# for a day must not block a merge. Needs the eyesweb-core wheel like docs.yml (TestPyPI while the variable CORE_FROM_TESTPYPI is true).

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the core from TestPyPI (only while it is not on PyPI)
        if: vars.CORE_FROM_TESTPYPI == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre --no-deps --index-url https://test.pypi.org/simple/ "eyesweb-core>=2.0.0a1,<2.1"
      - name: Install the pinned documentation toolchain, then the package
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install ".[docs]"
      - name: Check the links (the gallery is not executed)
        run: python -m sphinx -b linkcheck -D plot_gallery=0 docs docs/_build/linkcheck
